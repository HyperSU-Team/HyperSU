name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.55 - themed artwork animates again, SuSFS naming is consistent, and the settings dialogs refuse bad input.

            Fixed:
            - The character artwork on the home tiles is a GIF or animated WebP; `coil-gif` was declared in the version catalog but never added, so Coil drew only the first frame. The decoder is registered now and the tile animates.
            - Every standalone `SUS` / `SuS` in the strings is `SuSFS` (1209 places, all 47 locales). Kernel command names and resource keys are untouched.
            - The uname and build-time labels no longer name a different field than they edit, and the description sentence is complete.
            - Snackbars no longer sit 80.dp above a bar the shell already keeps them clear of; the reboot prompt appeared in the middle of the module list.
            - `SuperUserRepositoryImpl` read `applicationInfo` twice and asserted it non-null; one pass now, and a vanished package falls back to its package name instead of throwing.
            - `AppInfo.uid` tolerates a missing `ApplicationInfo`, and `DataSourceChannel` raises a readable `IOException` instead of a `NullPointerException` on a file-backed channel.

            Added:
            - Per-module banners: a module that ships no banner of its own can be given one from the appearance settings (stored in this app, never written into the module).
            - SuSFS path dialog rejects a relative path, an embedded space and a duplicate entry; the uname field rejects spaces. Apply stays disabled until the input is valid.

            Strings: 16 new resources, translated into all 47 locales.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.54...v4.2.55
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
