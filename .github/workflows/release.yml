name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.32 - every supported language is complete, banners default to 50%, and the docs site's vulnerable packages are updated.

            Translations:

            - All 43 locales now carry the full 944 strings. Coverage before this build ranged from 8 to 944 per language; Traditional Chinese was completed from the Simplified text, 2109 strings came from the community translations of KernelSU / SukiSU / ReSukiSU, and the rest were translated per locale with the placeholders, escape sequences and product names kept intact. A scripted pass verifies every locale: no missing keys, no placeholder mismatches, no duplicate keys, no replacement characters, valid XML.

            Banner: a module banner now defaults to 50% opacity instead of fully opaque. Existing installs stored the old 1.0, so it is migrated once - a stored 1.0 becomes 0.5, any other value is left alone.

            Build fix: the v4.2.31 banner migration used the `edit { }` extension without importing it and failed to compile; it now uses an explicit editor and applies it.

            Docs site: vite, esbuild, postcss, js-yaml, nanoid, @xmldom/xmldom, source-map-js and defu are pinned to their fixed releases through pnpm overrides and Vue is bumped past the @vue/server-renderer advisory, which clears the open Dependabot alerts. The site build also had 8 dead links to the licence files; they now point at the repository URLs.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.31...v4.2.32
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
