name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.49 - the second review pass: theme round trips, SuSFS persistence, and a set of blocking calls removed from composition.

            Theme import/export:
            - Re-importing a theme exported by this build deleted the page wallpapers and dashboard tiles whenever the multi-background switch was off. "Clear" now means two things: a missing slot for a set the theme describes, versus a switch that exists to show the picture. Page wallpapers and dashboard tiles survive an off switch.
            - A focus card with a picture but no switch key was turned on by the import and then had its picture deleted by the same pass; the slot decision now uses the same fallback the picker does.
            - The language stored in a theme was only restored on the FolkPatch path, so a theme exported here came back without it.
            - The module tab's icon was written under FolkPatch's alias (AModule), producing an entry the exporter never packs and a row the bar ignores; it uses this app's own destination name now, with the aliases still accepted on read.
            - The kernel wallpaper slot is part of the palette fallback again, so an imported picture is not orphaned.

            SuSFS:
            - The autostart toggle snapped back because it was gated on a `susfs module` subcommand this ksud does not ship; the persisted config is what applies at boot, so the toggle now sticks.
            - Settings with no ksud storage behind them are mirrored in the manager, so writing them no longer vanishes on the next read.
            - Reset actually resets: the confirm dialog was decorative, `resetToDefault` had no caller.
            - The SUS paths tab follows the app list through a flow; it used to observe a value that could never change.
            - The umount list parses the JSON ksud prints; the whitespace table it expected never matched, so the page was always empty.

            Responsiveness:
            - Font, music, sound-effect, title-image, SELinux and template work moved off the main thread or behind a debounce: the title-image sliders wrote the whole preference file on every frame, the SELinux dialog ran a root shell command per keystroke, and the template picker listed templates during composition.
            - `execl` gets a `(char*)nullptr` terminator, which the C++ rules require for a variadic call.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.48...v4.2.49
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
