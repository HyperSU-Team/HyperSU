name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.14 - the two readings line up with the home tile.

            ## Home

            On the Grid layout the kernel and SELinux readings were laid out as two equal slots stretched to the row, so their labels started at the row's top edge and sat above the wallpaper tile. They are one pair, not two slots: the column now centres them against the tile, which moves the pair down slightly and lines it up with the picture.

            ## From v4.2.12

            - The in-app update retries the APK through public mirrors, allows a longer download, and reports a failed transfer to the dialog (which then opens the release page).
            - The updater never downloads the `-spoofed` APK.
            - The Grid wallpaper tile is a 144dp square, as in the reference layout.
            - GPU load reads the vendor counter family that exists and no longer turns a real 0% into `--`.
            - Multi-manager support with icons, Built-in / Dynamic / Not authorized state and a risk confirmation before granting.
            - The module flash success page stays; downloaded zips open the confirmation; the module list reloads after an install started elsewhere.
            - SUSFS backup and restore no longer freeze the app.
            - Zygisk providers no longer stick on "reboot required".

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.13...v4.2.14
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
