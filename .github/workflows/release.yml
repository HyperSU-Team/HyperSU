name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.7 - the multi-manager screen, done properly.

            ## Multi-manager support

            Settings now offers **Multi-manager support**, the entry BakaSU has and this manager was missing. The kernel side (`feature/dynamic_manager.c`, `apk_sign.c`) and the CLI (`ksud kernel dynamic-manager`) were already there; what was missing was the way to use them.

            - Every installed app that ships `libksud.so` is listed with its icon, its name and its package.
            - Each row shows what the kernel thinks of it: **Built-in** when it matches a signature the kernel was built with, **Dynamic** when it was granted here, **Not authorized** otherwise. The status comes from the kernel's own manager table (`KSU_IOCTL_GET_MANAGERS`), not from guesswork.
            - Only an unauthorized row can be granted; granting or clearing first shows a confirmation.
            - Granting asks you to confirm the risk explicitly: a manager holds the highest privilege on the device, can read and write the system, install modules, grant root and run arbitrary code. A granted malicious manager would control the device and be hard to notice. The list also carries a standing warning above it.
            - The signature is read out of the chosen APK by `ksud`, so the app never parses it, and the choice survives a reboot.
            - Only the managers a grant replaced show a changed state; both the kernel config and the manager table are reloaded after every action.

            ## From v4.2.5

            - The module flash success page stays, with its reboot button.
            - Downloaded module zips and the notification's Install action open the confirmation again.
            - A module installed from outside the module screen shows up right away.
            - SUSFS backup and restore no longer freeze the app.
            - Zygisk providers no longer stick on "reboot required".

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.6...v4.2.7
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
