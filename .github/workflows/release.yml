name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.34 - a failed module download no longer crashes, updates check themselves, and the last vulnerable dependency is gone.

            - Downloading a module from the module store or from a module's update prompt went through `download()` without catching anything. On a filtered network the release host redirects to `release-assets.githubusercontent.com`, which resolves to 127.0.0.1 there, so the transfer threw `IOException` inside a coroutine and took the app down. Both paths go through the mirror helper now and show "download failed" instead.
            - The manager's own update check is automatic and on by default: it runs at startup (at most once every twelve hours) and offers the usual dialog, with the download also going through the mirrors. The old "check for updates" button is now a switch for this.
            - The alternate launcher icon row and its plumbing are removed.
            - `figlet-rs` is replaced by a static banner. It existed only to draw ASCII art and dragged in a second copy of the `zip` crate (0.6), which was the last Dependabot advisory; `zip` itself is on 9.5.1 now, which closes all remaining alerts.
            - The three new strings (download failed, automatic update check and its summary) are translated into every supported language.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.33...v4.2.34
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
