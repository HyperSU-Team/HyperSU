name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.47 - extraction and download paths fail safely instead of corrupting or crashing.

            A full pass over the manager's archive, payload and download code, plus the screens that write files.

            - OTA payload extraction writes an operation's bytes across every destination extent, not just the first, and fails on a short read instead of filling the missing bytes with zeros. The output hash is now computed while streaming rather than by mapping the whole partition.
            - KMI probing is bounded: the header's kernel size is attacker-controlled, and the walk no longer allocates whatever it claims (32 MiB cap, on file, stream and HTTP probes).
            - Theme, module and manager downloads are size-capped, so a bad mirror cannot fill the device; theme archive entries and `theme.json` have their own caps, and the downloaded APK is deleted when its digest does not match.
            - Flash and module-action logs go through MediaStore now. Writing `/sdcard/Download` directly failed on Android 10+ and crashed the save coroutine; failures are reported in the UI.
            - Markdown links are restricted to http/https, so release notes cannot launch arbitrary intents. Module banner and shortcut icons are decoded at a sampled size, so one oversized image cannot exhaust the heap.
            - The Magica boot receiver is no longer exported. SuSFS command arguments are quoted once, the music player is always released, and the WebUI detaches and cancels its file chooser cleanly.
            - Template JSON parsing uses a fixed locale, payload/image ZIP nesting is bounded, and a failed flash clears its in-flight flag.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.46...v4.2.47
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
