name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.54 - a manager review pass: crashes, main-thread work, stale state and every string.

            Crashes:
            - SuperUser and SuLog no longer crash on an empty app label or a missing field, and the Markdown page swallows a bad request instead of taking the process down.
            - The video wallpaper survives its player being released, and theme export, log save/send and module links report a failure instead of crashing.
            - Dynamic manager and SuSFS no longer crash without root.

            Main thread:
            - Root shell calls and file IO moved off the main thread on home, install, template editor, app profile, the reboot sheet, module snackbars, SuSFS backup/restore, the manager APK digest check and the unmount-path save.
            - The template ID is validated after typing stops instead of on every keystroke, and system monitoring stops sampling when the home page is left.

            State:
            - Module cards no longer act on stale data (uninstall followed by undo asked for confirmation again), and the bottom bar cannot drag to a hidden page or badge the wrong tab.
            - DPI 'follow system' survives a reboot, a finished download stays finished, SuSFS autostart can be turned off and a new profile is usable without leaving the page.
            - A just-downloaded theme is no longer deleted and the same theme stops appearing twice; the flash page does not show the previous result first.
            - Rotating after a kernel flash no longer flashes the same package again, and rotating during a module action no longer runs the script twice.
            - Exporting the 2025 palette specs writes the right values, and resetting the theme clears everything.
            - The SELinux hide switch no longer flips when the write fails, and 'compact list bottom bar' applies immediately.

            Removed: the duplicated profile mode row, the SuSFS current-values block and the no-op Grid dual-dim switch.

            Text: every new message is a string resource, translated into all 47 locales - log-save failures, the flash error line, boot-slot and cleanup log lines, and SuLog restart/dropped tags. English copy and accessibility labels are polished.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.53...v4.2.54
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
