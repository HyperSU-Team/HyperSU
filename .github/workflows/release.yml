name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.45 - downloads cannot hang the screen any more.

            - A download whose service was killed (backgrounded and reaped, or a crash) never reported a final state, and the caller waited for a status that would never arrive: the dialog stayed on 'downloading' forever. The wait now has a fifteen minute deadline; when it passes, the download is forgotten and the caller gets an error it can show.
            - Forgetting it also clears the 'same url is already downloading' entry, so tapping again starts a fresh attempt instead of joining a dead one.
            - The manager update check no longer walks the remaining mirrors after the screen that started it is gone; a cancelled coroutine propagates instead of being swallowed by runCatching.
            - The completion notification's second action is labelled Delete instead of Cancel: it deletes the downloaded file, it never cancelled anything.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.44...v4.2.45
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
