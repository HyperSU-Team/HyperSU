name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.8 - the GPU reading, fixed.

            ## Home

            The GPU chart kept falling back to `--` and occasionally showed a wrong number. Three causes, all fixed:

            - **Only three sysfs nodes were tried, all through the root shell.** Adreno's `gpu_busy_percentage` and `gpubusy`, plus Mali's `/sys/class/misc/mali0/device/utilization`. A counter that lives elsewhere - a `.mali` platform node, a generic `gpu_busy` - was never read at all, and every sample paid for a `cat` process.
            - **An unreadable sample was reported as 0.** A GPU that powered down (its cumulative counters stop advancing) or a single failed read produced 0, and 0 drew as `--`, so a working GPU could look absent for a tick.
            - **The chart only printed a value above zero**, so a real 0% load was indistinguishable from "no data".

            The node is now read directly first and through the root shell only when it is unreadable. The counter family is probed once and remembered, re-probed when a read starts failing, the last good value survives a single failed sample, and 0% gets its own number. A device with no counter at all hides the GPU chart instead of leaving a permanent `--`.

            ## From v4.2.7

            - Multi-manager support: manager list with icons and Built-in / Dynamic / Not authorized state from the kernel manager table, explicit risk confirmation before granting.
            - The module flash success page stays, with its reboot button.
            - Downloaded module zips and the notification's Install action open the confirmation again.
            - A module installed from outside the module screen shows up right away.
            - SUSFS backup and restore no longer freeze the app.
            - Zygisk providers no longer stick on "reboot required".

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.7...v4.2.8
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
