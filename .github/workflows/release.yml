name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.16 - a faster theme store, downloaded themes, and a music button.

            ## Theme store

            - **Opens immediately.** The catalogue is cached on disk and refreshed at most every ten minutes; the screen shows the last list while a stale one is replaced.
            - **Search** by theme name or release tag.
            - **Downloaded tab** with every theme that is on the device: Apply or Delete. The store used to delete the archive right after importing it, so a theme could not be applied twice without downloading it again; a manual `.fpt` import is kept there too.
            - **Previews are fitted whole.** They are phone screenshots, and cropping them to a fixed height showed only the middle of each theme.

            ## Home

            - A play/pause button appears in the top bar when a background track is configured, so the music can be stopped without opening settings.

            ## Bottom-bar icons

            A theme names its module icon `KModule` or `AModule`, FolkPatch's two module tabs, while this app has a single `Module` tab - so the file never matched and the module tab kept its built-in glyph. The names are now mapped on import and at lookup, and the archive extractor no longer drops them.

            ## From v4.2.15

            - Theme store backed by the community theme repository.
            - `.fpt` imports keep music, sound effects and bottom-bar icons (FolkPatch packs media at the archive root).

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.15...v4.2.16
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
