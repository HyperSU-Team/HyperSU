name: Release
permissions:
  contents: write
  actions: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done
      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the built-in token; no secret is needed.
          token: ${{ github.token }}
          name: ${{ github.ref_name }}
          # Refresh these notes before tagging; an empty body leaves the manager's update dialog with nothing to show.
          body: |
            HyperSU v4.2.51 - a flash survives rotation, and the screens around it stop losing their state.

            Flashing:
            - Boot/module flashing moved out of the composition into an application-scoped runner. A rotation or dark-mode change used to recreate the activity mid-write, kill the callbacks carrying the result, and leave the recreated screen on "Flashing" with back and swipe disabled even after the write finished. The screen observes the runner's text, reboot flag and status, and the log survives recreation.
            - The kernel-flash page rebuilds its log from the flash state on every change instead of only polling for a workspace it started itself; a screen recreated during the flash keeps streaming and the final lines are no longer dropped.
            - The flash status holder's fields are volatile, so a re-created screen cannot start a second worker from a stale "not flashing" read.

            Navigation and modules:
            - The navigation rail applies the same kernel-support filter as the floating bottom bar, so Superuser/Module are not offered on large screens without a driver; tabs are selected by page index rather than list position.
            - A module update download that finishes while the app is backgrounded is pushed to the flash screen instead of being silently discarded.
            - The install-confirm toggle is read when it is needed instead of being remembered for the process, so changing it in Settings takes effect immediately.

            Settings and data:
            - Template editor autosave is debounced, runs off the main thread, flushes on exit, and reports failures instead of snapping the field back; SELinux rule validation is debounced too.
            - Storage stats read `df` rows by their numeric columns, so a long device name wrapping onto its own line no longer misreports partition sizes.
            - The SuSFS restore temp file is deleted after use, and the log filter preference is no longer written from inside a state transform.

            **Full changelog**: https://github.com/HyperSU-Team/HyperSU/compare/v4.2.50...v4.2.51
          files: |
            Manager/*.apk
            Manager-spoofed/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
