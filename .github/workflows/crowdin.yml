name: Crowdin Action

# Disabled by default in this fork.
#
# The action needs a Crowdin project and its API token. A fork does not have them, so every
# run failed with "Required option 'api_token' is missing" / "Required option 'project_id' is
# missing" - the variables resolve to empty when the secrets are absent. The workflow is kept
# rather than deleted so it can be re-enabled by setting the secrets, but it no longer runs on
# its own: a schedule or a push to main would fail on every translation change.
#
# To use it, set CROWDIN_PROJECT_ID, CROWDIN_API_TOKEN and GH_TOKEN in the repository secrets
# and uncomment the triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'manager/app/src/main/res/values/strings.xml'
  #     - 'manager/app/src/main/res/values-*/strings.xml'
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Crowdin Action
      uses: crowdin/github-action@v2
      with:
        upload_sources: true
        upload_translations: true
        auto_approve_imported: true
        download_translations: true
        skip_untranslated_files: false
        skip_untranslated_strings: true

        create_pull_request: true
        localization_branch_name: "Crowdin"
        pull_request_labels: 'enhancement, translation'
        pull_request_title: 'opt: sync translation from Crowdin'

        config: 'crowdin.yml'
        crowdin_branch_name: "main"
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}